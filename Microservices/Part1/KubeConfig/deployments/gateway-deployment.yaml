apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: nightcall018/kubernetesapp:gateway
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config-volume
              mountPath: /app/ocelot.json
              subPath: ocelot.json
      volumes:
        - name: config-volume
          configMap:
            name: api-gateway-config
