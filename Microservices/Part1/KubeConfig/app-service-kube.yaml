apiVersion: v1
kind: Service
metadata:
  name: app-service-gateway
  namespace: microservices
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30001
---
apiVersion: v1
kind: Service
metadata:
  name: app-service-movie
  namespace: microservices
spec:
  type: NodePort
  selector:
    app: movie
  ports:
    - protocol: TCP
      port: 5004
      targetPort: 5004
---
apiVersion: v1
kind: Service
metadata:
  name: app-service-communication
  namespace: microservices
spec:
  selector:
    app: communication-service
  ports:
    - protocol: TCP
      port: 5003
      targetPort: 5003
---
apiVersion: v1
kind: Service
metadata:
  name: app-service-auth
  namespace: microservices
spec:
  selector:
    app: auth-service
  ports:
    - protocol: TCP
      port: 5002
      targetPort: 5002
